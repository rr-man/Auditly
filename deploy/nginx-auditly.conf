# Auditly -- two server blocks, one shared body. Deliberately NOT
# default_server: the box has other sites and this one must not catch strays.

server {
    listen 8444 ssl;
    server_name qa-server.example.com qa-server localhost;
    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;
    access_log /var/log/nginx/auditly.access.log;
    error_log  /var/log/nginx/auditly.error.log;
    include /etc/nginx/auditly-common.conf;
}

server {
    listen 443 ssl;
    server_name auditly.example.com;
    ssl_certificate     __CERT__;
    ssl_certificate_key __KEY__;
    access_log /var/log/nginx/auditly.access.log;
    error_log  /var/log/nginx/auditly.error.log;
    include /etc/nginx/auditly-common.conf;
}

server {
    listen 80;
    server_name auditly.example.com;
    return 301 https://$host$request_uri;
}
