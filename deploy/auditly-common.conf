# Shared body for both Auditly server blocks.

ssl_protocols       TLSv1.2 TLSv1.3;
ssl_ciphers         HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:auditly:10m;
ssl_session_timeout 1d;
add_header Strict-Transport-Security "max-age=31536000" always;

# The app sets its own CSP, X-Frame-Options, nosniff and Referrer-Policy per
# response; they are not repeated here so the two copies cannot drift.

# Uploads: must be >= AUDITLY_MAX_UPLOAD_MB in .env (200) with headroom.
client_max_body_size 210m;
client_body_timeout  300s;
proxy_http_version   1.1;

# Stream both directions: the upload goes straight to the app (which validates
# before reading the body) and audio playback uses Range requests.
proxy_buffering         off;
proxy_request_buffering off;

location / {
    proxy_pass http://127.0.0.1:8084;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Edge rate-limit on login in addition to the app's per-account limit.
location = /auth/login {
    limit_req zone=auditlylogin burst=10 nodelay;
    proxy_pass http://127.0.0.1:8084;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ /\. { deny all; return 404; }
